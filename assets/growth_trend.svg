<svg viewBox="0 0 500 220" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for Area Fills -->
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117" rx="8"/>
  <!-- Muted Grid Lines -->
  <line x1="50" y1="30" x2="470" y2="30" stroke="#21262d" stroke-width="1"/>
  <line x1="50" y1="65" x2="470" y2="65" stroke="#21262d" stroke-width="1"/>
  <line x1="50" y1="100" x2="470" y2="100" stroke="#21262d" stroke-width="1"/>
  <line x1="50" y1="135" x2="470" y2="135" stroke="#21262d" stroke-width="1"/>
  <line x1="50" y1="170" x2="470" y2="170" stroke="#21262d" stroke-width="1"/>
  
  <!-- Y-Axis Labels -->
  <text x="25" y="35" fill="#8b949e" font-family="sans-serif" font-size="10">180</text>
  <text x="25" y="70" fill="#8b949e" font-family="sans-serif" font-size="10">140</text>
  <text x="25" y="105" fill="#8b949e" font-family="sans-serif" font-size="10">100</text>
  <text x="25" y="140" fill="#8b949e" font-family="sans-serif" font-size="10">60</text>
  <text x="25" y="175" fill="#8b949e" font-family="sans-serif" font-size="10">20</text>

  <!-- Area Graph Green (CRM Expansion) -->
  <path d="M 50,170 C 90,80 130,120 170,90 C 210,60 250,150 290,50 C 330,40 370,140 410,70 C 440,90 470,80 470,80 L 470,170 Z" fill="url(#greenGrad)"/>
  <path d="M 50,170 C 90,80 130,120 170,90 C 210,60 250,150 290,50 C 330,40 370,140 410,70 C 440,90 470,80 470,80" fill="none" stroke="#39ff14" stroke-width="2.5"/>

  <!-- Area Graph Pink (Integration Complexity) -->
  <path d="M 50,140 C 90,160 130,130 170,150 C 210,120 250,130 290,110 C 330,120 370,80 410,130 C 440,110 470,60 470,60 L 470,170 Z" fill="url(#pinkGrad)"/>
  <path d="M 50,140 C 90,160 130,130 170,150 C 210,120 250,130 290,110 C 330,120 370,80 410,130 C 440,110 470,60 470,60" fill="none" stroke="#ff007f" stroke-width="2.5"/>

  <!-- X-Axis Labels -->
  <text x="50" y="195" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">2018</text>
  <text x="134" y="195" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">2020</text>
  <text x="218" y="195" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">2022</text>
  <text x="302" y="195" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">2024</text>
  <text x="386" y="195" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">2025</text>
  <text x="470" y="195" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">Present</text>
</svg>
