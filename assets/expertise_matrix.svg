<svg viewBox="0 0 340 340" width="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117" rx="8"/>
  <!-- Ring 1: Dynamics 365 (95%) -->
  <g transform="translate(0, 0)">
    <circle cx="85" cy="85" r="50" fill="none" stroke="#21262d" stroke-width="10"/>
    <circle cx="85" cy="85" r="50" fill="none" stroke="#39ff14" stroke-width="10" 
            stroke-dasharray="314.16" stroke-dashoffset="15.7" stroke-linecap="round" transform="rotate(-90 85 85)"/>
    <text x="85" y="90" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">95%</text>
    <text x="85" y="155" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Dynamics 365</text>
  </g>
  <!-- Ring 2: Power Apps (95%) -->
  <g transform="translate(170, 0)">
    <circle cx="85" cy="85" r="50" fill="none" stroke="#21262d" stroke-width="10"/>
    <circle cx="85" cy="85" r="50" fill="none" stroke="#00f3ff" stroke-width="10" 
            stroke-dasharray="314.16" stroke-dashoffset="15.7" stroke-linecap="round" transform="rotate(-90 85 85)"/>
    <text x="85" y="90" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">95%</text>
    <text x="85" y="155" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Power Apps</text>
  </g>
  <!-- Ring 3: Power Automate (90%) -->
  <g transform="translate(0, 170)">
    <circle cx="85" cy="85" r="50" fill="none" stroke="#21262d" stroke-width="10"/>
    <circle cx="85" cy="85" r="50" fill="none" stroke="#ff007f" stroke-width="10" 
            stroke-dasharray="314.16" stroke-dashoffset="31.4" stroke-linecap="round" transform="rotate(-90 85 85)"/>
    <text x="85" y="90" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">90%</text>
    <text x="85" y="155" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Power Automate</text>
  </g>
  <!-- Ring 4: Azure Cloud (85%) -->
  <g transform="translate(170, 170)">
    <circle cx="85" cy="85" r="50" fill="none" stroke="#21262d" stroke-width="10"/>
    <circle cx="85" cy="85" r="50" fill="none" stroke="#bd00ff" stroke-width="10" 
            stroke-dasharray="314.16" stroke-dashoffset="47.1" stroke-linecap="round" transform="rotate(-90 85 85)"/>
    <text x="85" y="90" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">85%</text>
    <text x="85" y="155" fill="#8b949e" font-family="sans-serif" font-size="11" text-anchor="middle">Azure Cloud</text>
  </g>
</svg>
